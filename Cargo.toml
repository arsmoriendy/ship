[package]
name = "ship"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
derive-new = "0.7.0"
derive_setters = "0.1.9"
directories = "6.0.0"
hex = { version = "0.4.3", features = ["serde"] }
ratatui = { version = "0.30.1", features = ["macros"] }
crossterm = { version = "0.29.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
smart-default = "0.7.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
